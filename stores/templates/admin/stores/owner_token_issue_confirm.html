{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
  {% if issue_error %}
    <p class="errornote">{{ issue_error }}</p>
  {% endif %}
  <p><strong>{{ store }}</strong>의 기존 활성 Owner Token을 모두 비활성화하고 새 링크를 발급합니다.</p>
  <p>발급된 원본 링크는 다음 화면에서 한 번만 확인할 수 있습니다.</p>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="action" value="{{ action_name }}">
    <input type="hidden" name="confirm_owner_token_issue" value="yes">
    <input type="hidden" name="issue_nonce" value="{{ issue_nonce }}">
    {% for object in objects %}
      <input type="hidden" name="{{ action_checkbox_name }}" value="{{ object.pk }}">
    {% endfor %}
    <input type="submit" value="발급하기" class="default">
    <a href="{{ back_url }}" class="button cancel-link">취소</a>
  </form>
{% endblock %}
